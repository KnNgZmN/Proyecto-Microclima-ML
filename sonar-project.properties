# Configuración de análisis para SonarQube Cloud (sonarcloud.io).
#
# IMPORTANTE: reemplaza TU_ORGANIZACION por la clave de tu organización, que
# aparece en SonarQube Cloud → tu organización → Administration → Key.
# La clave del proyecto la propone el asistente "Create Project"; por defecto
# usa el formato <organizacion>_<nombre-del-repositorio>.

sonar.projectKey=TU_ORGANIZACION_Proyecto-Microclima-ML
sonar.organization=TU_ORGANIZACION
sonar.projectName=Microclima Bogota ML
sonar.projectVersion=1.0

# Código analizado: backend HTTP (api/), lógica de ML (src/) y front web (web/).
sonar.sources=api,src,web
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml

# Artefactos, dependencias y datos generados: fuera del análisis.
sonar.exclusions=venv/**,models/**,data/**,htmlcov/**,**/__pycache__/**,docs/**

# El front no tiene pruebas unitarias propias: se excluye de la métrica de
# cobertura para que no baje el Quality Gate con un 0 % artificial.
sonar.coverage.exclusions=web/**

# app/streamlit_app.py queda fuera de sonar.sources: es el prototipo en
# Streamlit, sustituido por el front de web/ + la API de api/.
# Añade "app" a sonar.sources si quieres medirlo también.
