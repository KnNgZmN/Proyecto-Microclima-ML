# Configuración de análisis para SonarQube Cloud (sonarcloud.io).
#
# Claves verificadas contra la API de SonarQube el 2026-08-19.
# Ojo con las mayúsculas: la organización va en minúsculas (knngzmn) pero la
# clave del proyecto conserva el nombre de usuario tal cual (KnNgZmN_...).

sonar.projectKey=KnNgZmN_Proyecto-Microclima-ML
sonar.organization=knngzmn
sonar.projectName=Microclima Bogota ML
sonar.projectVersion=1.0

# Código analizado: backend HTTP (api/), lógica de ML (src/) y front web (web/).
sonar.sources=api,src,web
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12, 3.13
sonar.python.coverage.reportPaths=coverage.xml

# Artefactos, dependencias y datos generados: fuera del análisis.
sonar.exclusions=venv/**,node_modules/**,models/**,data/**,htmlcov/**,coverage-web/**,**/__pycache__/**,docs/**

# Cobertura del front: Vitest genera lcov.info con el proveedor v8.
# El front YA NO se excluye de la métrica: incluirlo es el objetivo de esta
# implementación. La línea base fue 0 % y se sube con pruebas reales.
sonar.javascript.lcov.reportPaths=coverage-web/lcov.info

# Las pruebas no son código de producción: se declaran, no se analizan.
sonar.tests=tests,tests-web

# Alcance de la cobertura: debe coincidir con el bloque `omit` de
# pyproject.toml, o las dos herramientas reportan cifras distintas sobre el
# mismo codigo. Estos tres scripts ejecutan todo su cuerpo al importarse
# (les falta la guarda __main__), asi que ninguna prueba puede cargarlos.
# Se siguen ANALIZANDO -sus code smells y complejidad si cuentan-, pero no
# se les exige cobertura.
sonar.coverage.exclusions=src/generate_dataset.py,src/train_model.py,src/visualization.py

# app/streamlit_app.py queda fuera de sonar.sources: es el prototipo en
# Streamlit, sustituido por el front de web/ + la API de api/.
# Añade "app" a sonar.sources si quieres medirlo también.
