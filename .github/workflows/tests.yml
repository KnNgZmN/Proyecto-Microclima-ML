name: Pruebas y Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cobertura:
    name: pytest + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Codecov necesita el historial para calcular el diff coverage del PR
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # data/raw/*.csv y models/*.pkl están en .gitignore: no existen en CI.
      # La suite no debe depender de ellos (el modelo se sustituye por un doble).
      - name: Ejecutar pruebas con cobertura de líneas y ramas
        run: |
          pytest --cov --cov-branch \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-report=html

      # El reporte se pasa al job de SonarQube en lugar de volver a correr pytest.
      - name: Guardar coverage.xml para SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-xml
          path: coverage.xml
          retention-days: 1

      - name: Publicar cobertura en Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Guardar el reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-html
          path: htmlcov/
          retention-days: 30

      - name: Resumen de cobertura en la pestaña Summary
        if: always()
        run: |
          echo "### Cobertura — Python (api + src)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # '|| true': el umbral ya lo aplica el paso de pytest; aquí solo se muestra
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  front:
    name: vitest + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 'npm ci' instala exactamente lo del package-lock: es reproducible,
      # a diferencia de 'npm install', que puede resolver versiones nuevas.
      - name: Instalar dependencias del front
        run: npm ci

      # El umbral vive en vitest.config.js, igual que fail_under vive en
      # pyproject.toml: si la cobertura del front cae, este paso falla.
      - name: Ejecutar pruebas del front con cobertura
        run: npx vitest run --coverage

      - name: Guardar lcov.info para SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-lcov
          path: coverage-web/lcov.info
          retention-days: 1

      # Bandera propia: permite seguir por separado la evolucion del backend
      # y la del front en Codecov, en vez de ver un solo promedio.
      - name: Publicar cobertura del front en Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-web/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Resumen de cobertura en la pestana Summary
        if: always()
        run: |
          echo "### Cobertura - Front web (web/js)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npx vitest run --coverage --coverage.reporter=text-summary >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  sonarqube:
    name: SonarQube Cloud
    # Espera a los dos: analiza Python y JavaScript en un mismo proyecto.
    needs: [cobertura, front]
    runs-on: ubuntu-latest

    # Se declara a nivel de job para poder consultarlo en el "if" del paso:
    # sin el secreto configurado el analisis se omite en vez de fallar.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # SonarQube usa el historial para asignar los issues a cada autor
          fetch-depth: 0

      - name: Recuperar la cobertura de Python
        uses: actions/download-artifact@v4
        with:
          name: cobertura-xml

      # La ruta debe coincidir con sonar.javascript.lcov.reportPaths
      # declarado en sonar-project.properties.
      - name: Recuperar la cobertura del front
        uses: actions/download-artifact@v4
        with:
          name: cobertura-lcov
          path: coverage-web

      # Requiere el secreto SONAR_TOKEN, la organizacion correcta en
      # sonar-project.properties y "Automatic Analysis" DESACTIVADO en
      # SonarQube Cloud (si esta activo, el analisis de CI da error).
      - name: Analizar con SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

      - name: Avisar si falta el secreto
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no esta configurado; se omitio el analisis de SonarQube."
