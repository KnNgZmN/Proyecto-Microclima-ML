name: Pruebas y Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cobertura:
    name: pytest + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          # Codecov necesita el historial para calcular el diff coverage del PR
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # data/raw/*.csv y models/*.pkl están en .gitignore: no existen en CI.
      # La suite no debe depender de ellos (el modelo se sustituye por un doble).
      - name: Ejecutar pruebas con cobertura de líneas y ramas
        run: |
          pytest --cov --cov-branch \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-report=html

      - name: Publicar cobertura en Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Guardar el reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-html
          path: htmlcov/
          retention-days: 30

      - name: Resumen de cobertura en la pestaña Summary
        if: always()
        run: |
          echo "### Cobertura de pruebas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # '|| true': el umbral ya lo aplica el paso de pytest; aquí solo se muestra
          coverage report >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
